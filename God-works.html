<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Works Company</title>
    <link rel="stylesheet" href="styles/store.css">
    <link rel="stylesheet" href="styles/head.css">
</head>

<body>
    <header class="the-above">
        <div class="first-part">
       GOD WORKS COMPANY
        </div>
        <div class="second-part">
            <input class="search-box" type="text" placeholder="Search">
            <button class="search-icon-button">
                <img class="search-icon" src="images/emblem/search.svg" alt="">
                <div class="tooltip">search</div>
            </button>
            <button class="voice-search-button">
                <img class="voice-search-icon" src="images/emblem/voice-search-icon.svg" alt="">
                <div class="tooltip">Voice Search</div>
            </button>
        </div>
        <div class="third-part">
            <a class="s-link" href="#">
                <span class="returns-text">Returns</span>
                <span class="orders-text">& Orders</span>
            </a>
            <a href="#"><img class="cart-icon" src="images/cart-image/cart-icon.png" alt=""></a>
        </div>
    </header>
    <section class="products-grid">
        <div class="product-container">
            <img class="product-image" src="images/products/electric-kettle.jpg" alt="">
            <div class="product-info">Fast Boil Electric Kettle</div>
            <div class="product-rating">
                <div class="product-rating-container">
                    <img class="product-rating-stars" src="images/ratings/rating-45.png" alt="">
                </div>
                <div class="product-rating-count">10</div>
            </div>
            <div class="product-price">$10</div>
            <div class="added-to-cart">
                <button class="add-to-cart-button">add to cart</button>
            </div>
        </div>
        <div class="product-container">
            <img class="product-image" src="images/products/honey(1kg).jpg" alt="">
            <div class="product-description">
                <div class="product-info">Natural honey(1kg)</div>
            </div>
        </div>
        <div class="product-container"><img class="product-image" src="images/products/jug-glass.jpg" alt=""></div>
        <div class="product-container"><img class="product-image" src="images/products/mug.jpg" alt=""></div>
        <div class="product-container"><img class="product-image" src="images/products/plates.jpg" alt=""></div>
        <div class="product-container"><img class="product-image" src="images/products/rice(25kg).webp" alt=""></div>
    </section>


    <script type="module" src="scripts/God-works.js"></script>
</body>

</html>
