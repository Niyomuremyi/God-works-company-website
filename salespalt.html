<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Works Company</title>
    <link rel="stylesheet" href="products-styles.css">
    <link rel="stylesheet" href="latete.css">
</head>

<body>
    <header class="the-above">
        <div class="first-part">
            <img class="hamburger-menu" src="emblem/hamburger-menu.svg" alt="">
            <canvas class="canvas-logo" width="200" height="16" style="border:1px solid red"></canvas>
        </div>
        <div class="second-part">
            <input class="search-box" type="text" placeholder="Search">
            <button class="search-icon-button">
                <img class="search-icon" src="emblem/search.svg" alt="">
                <div class="tooltip">search</div>
            </button>
            <button class="voice-search-button">
                <img class="voice-search-icon" src="emblem/voice-search-icon.svg" alt="">
                <div class="tooltip">Voice Search</div>
            </button>
        </div>
        <div class="third-part">
            <div class="upload-icon">
                <img class="upload" src="emblem/upload.svg" alt="">
                <div class="tooltip">upload</div>
            </div>
            <img class="GDWC" src="emblem/GDWC-apps.svg" alt="">
            <div class="notifications-icon">
                <img class="notifications" src="emblem/notifications.svg" alt="">
                <div class="notifications-number">5</div>
            </div>
            <img class="profile-picture" src="profile-picture/Elissa.jpg" alt="">
        </div>
    </header>
    <section class="grid-products">
        <div class="product-preview">
            <img class="products" src="products/electric-kettle.jpg" alt="">
            <div class="product-description">
                <div class="product-info">Modern electric kettle that's fast and convenient for boiling</div>
                <div><img src="rating-images/rating-45" alt=""></div>
            </div>
        </div>
        <div class="product-preview">
            <img class="products" src="products/honey(1kg).jpg" alt="">
            <div class="product-description">
                <div class="product-info">Natural honey with no sugar additives</div>
                <div><img src="rating-images/rating-50" alt=""></div>
            </div>
        </div>
        <div class="product-preview"><img class="products" src="products/jug-glass.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/mug.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/plates.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/rice(25kg).webp" alt=""></div>
        <div class="product-preview"><img class="products" src="products/rice-cooker.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/wine-glass.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/maize-flour-sac(25kg).avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/forks.webp" alt=""></div>
        <div class="product-preview"><img class="products" src="products/bucket.webp" alt=""></div>
        <div class="product-preview"><img class="products" src="products/bulb.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/matelas.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/plastic-chair.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/plastic-table.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/pan.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/bible.webp" alt=""></div>
        <div class="product-preview"><img class="products" src="products/sauvage-spray.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/vaseline-lotion.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/aveno-lotion.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/mixer.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/aluminium-foil.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/take-away.webp" alt=""></div>
        <div class="product-preview"><img class="products" src="products/american-garden.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/inyange-water.webp" alt=""></div>
        <div class="product-preview"><img class="products" src="products/inyange-juice.jpg" alt=""></div>
        <div class="product-preview"><img class="products" src="products/air-fresher.avif" alt=""></div>
        <div class="product-preview"><img class="products" src="products/toiler-cleaner.avif" alt=""></div>
    </section>

    <script src="forcanvas.js"></script>
    <script src="data/products.js"></script>
</body>

</html>
